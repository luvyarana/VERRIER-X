# Render's free plan puts the backend to sleep after 15 minutes without visitors, and the
# first visitor then waits about a minute. This asks for the health page every 10 minutes
# so the backend stays awake.
name: Keep backend awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://verrier-x-api.onrender.com/api/health
