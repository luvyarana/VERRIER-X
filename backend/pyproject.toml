[project]
name = "verrier-x-backend"
version = "0.1.0"
description = "Backend for VERRIER-X: SPHEREx cutout search, alignment and rendering"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "astropy>=8.0.2",
    "fastapi>=0.163.0",
    "fsspec>=2026.9.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyvo>=1.10.0",
    "reproject>=0.21.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
